[project]
name = "whispertype"
version = "0.1.0"
description = "气声输入：按住热键小声说，松开把文字送进当前窗口"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.5.0",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
doctor = ["pycaw>=20240210"]
test = ["pytest>=7"]

[project.scripts]
whispertype = "whispertype.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]